<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Storages</title>
</head>
<body class="w-screen min-h-screen py-20">
<h1 class="flex justify-center text-4xl">Storages</h1>
<div class="flex justify-center py-10">
  <div class="w-full max-w-4xl">
    <div class="flex justify-end mb-4">
      <a class="text-white bg-blue-800 hover:bg-gray-900 font-medium rounded-lg text-sm px-5 py-2.5"
         href="/storages/new">New Storage</a>
    </div>
    <table class="w-full border-collapse border border-gray-200">
      <thead>
      <tr class="bg-gray-100">
        <th class="border border-gray-300 px-4 py-2 text-left">Name</th>
        <th class="border border-gray-300 px-4 py-2 text-left">Street</th>
        <th class="border border-gray-300 px-4 py-2 text-left">City</th>
        <th class="border border-gray-300 px-4 py-2 text-left">Zip</th>
        <th class="border border-gray-300 px-4 py-2 text-left">Actions</th>
      </tr>
      </thead>
      <tbody>
      {#for storage in storages}
      <tr class="hover:bg-gray-50">
        <td class="border border-gray-300 px-4 py-2">{storage.name}</td>
        <td class="border border-gray-300 px-4 py-2">{#if storage.address}{storage.address.street} {storage.address.number}{/if}</td>
        <td class="border border-gray-300 px-4 py-2">{#if storage.address}{storage.address.city}{/if}</td>
        <td class="border border-gray-300 px-4 py-2">{#if storage.address}{storage.address.zipcode}{/if}</td>
        <td class="border border-gray-300 px-4 py-2">
          <a class="text-blue-600 hover:underline mr-2" href="/storages/edit/{storage.id}">Edit</a>
          <a class="text-red-600 hover:underline" href="/storages/delete/{storage.id}">Delete</a>
        </td>
      </tr>
      {/for}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
