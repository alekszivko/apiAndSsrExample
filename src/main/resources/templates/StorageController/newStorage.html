<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>New Storage</title>
</head>
<body class="w-screen min-h-screen py-20">
<h1 class="flex justify-center text-4xl">New Storage</h1>
<div class="flex justify-center py-10">
  <form method="post" action="/storages/new" class="w-full max-w-lg">
    <div class="space-y-12">
      <div class="border-b border-gray-900/10 pb-12">
        <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

          <div class="sm:col-span-4">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="name">Name</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="name" name="name" type="text" value="{form.name}" required>
            </div>
          </div>

          <div class="sm:col-span-4">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="street">Street</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="street" name="street" type="text" value="{form.street}" required>
            </div>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="number">Number</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="number" name="number" type="number" value="{form.number}" required>
            </div>
          </div>

          <div class="sm:col-span-4">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="addressAddition">Address Addition</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="addressAddition" name="addressAddition" type="text" value="{form.addressAddition}">
            </div>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="zipcode">Zipcode</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="zipcode" name="zipcode" type="number" value="{form.zipcode}" required>
            </div>
          </div>

          <div class="sm:col-span-4">
            <label class="block text-sm font-medium leading-6 text-gray-900" for="city">City</label>
            <div class="mt-2">
              <input class="block w-full rounded-md border-0 py-1.5 px-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                     id="city" name="city" type="text" value="{form.city}" required>
            </div>
          </div>

        </div>
      </div>
    </div>
    <div class="mt-6 flex items-center justify-end gap-x-6">
      <a class="text-sm font-semibold leading-6 text-gray-900" href="/storages">Cancel</a>
      <button class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500"
              type="submit">Save</button>
    </div>
  </form>
</div>
</body>
</html>
