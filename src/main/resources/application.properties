# Datasource - DevServices auto-starts PostgreSQL in dev/test mode
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=user
quarkus.datasource.password=password
# For production, override: quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/samic

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=data.sql

# HTTP
quarkus.http.port=8080

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/api/api-docs

# Logging
quarkus.log.level=WARN
quarkus.log.category."at.spengergasse".level=DEBUG

# External REST client
quarkus.rest-client.customer-data.url=https://httpbin.org

# Test profile: use H2 in-memory database (avoids Docker/Testcontainers requirement)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
%test.quarkus.datasource.devservices.enabled=false
